name: Release Gate

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-gate
  cancel-in-progress: false

jobs:
  fedora:
    if: github.event_name == 'workflow_dispatch'
    name: Fedora x86_64 release gate
    runs-on:
      - self-hosted
      - linux
      - x64
      - fedora
      - qwe-release
    timeout-minutes: 90
    env:
      PATH: /home/.local/bin:/usr/local/rust/bin:/usr/local/python/3.12/bin:/usr/local/bin:/usr/bin:/bin:/usr/local/sbin:/usr/sbin

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Verify dedicated runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          . /etc/os-release
          test "$ID" = fedora
          command -v just
          command -v systemctl
          systemctl --user show-environment >/dev/null
          printf 'Fedora %s release runner ready\n' "$VERSION_ID"

      - name: Prepare protocol validation environment
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/qwe-ci-venv"
          "$RUNNER_TEMP/qwe-ci-venv/bin/python" -m pip install \
            -r scripts/requirements-protocol.txt
          printf '%s\n' "$RUNNER_TEMP/qwe-ci-venv/bin" >> "$GITHUB_PATH"

      - name: Require a clean source checkout
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            printf 'release gate requires a clean checkout\n' >&2
            exit 1
          fi

      - name: Run complete release gate
        run: just release-gate

      - name: Verify manifest and record archive checksum
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 |
            python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          archive="dist/qwe-${version}-linux-x86_64.tar.gz"
          test -f "$archive"
          package_root="$(basename "${archive%.tar.gz}")"
          manifest="$RUNNER_TEMP/qwe-release.json"
          tar -xOzf "$archive" "$package_root/release.json" > "$manifest"
          python3 - "$manifest" <<'PY'
          import json
          import os
          import sys

          with open(sys.argv[1], encoding="utf-8") as stream:
              manifest = json.load(stream)
          commit = os.environ["GITHUB_SHA"]
          assert manifest["schema"] == "qwe-release/v1", manifest
          assert manifest["target"] == "linux-x86_64", manifest
          assert manifest["source_dirty"] is False, manifest
          assert commit.startswith(manifest["source_commit"]), (
              commit,
              manifest,
          )
          PY
          sha256sum "$archive" > "$archive.sha256"
          cat "$archive.sha256"

      - name: Preserve release candidate on runner
        shell: bash
        run: |
          set -euo pipefail
          candidate_dir="$HOME/qwe-release-candidates/$GITHUB_SHA"
          mkdir -p "$candidate_dir"
          cp dist/qwe-*-linux-x86_64.tar.gz "$candidate_dir/"
          cp dist/qwe-*-linux-x86_64.tar.gz.sha256 "$candidate_dir/"

      - name: Upload release-gate evidence
        uses: actions/upload-artifact@v7
        with:
          name: qwe-linux-x86_64-release-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/qwe-*-linux-x86_64.tar.gz
            dist/qwe-*-linux-x86_64.tar.gz.sha256

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    name: Build and publish GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Rust components
        run: rustup component add rustfmt clippy

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-protocol.txt

      - name: Install protocol validation dependency
        run: python3 -m pip install -r scripts/requirements-protocol.txt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run workspace tests
        run: cargo test --workspace -- --test-threads=1

      - name: Validate protocol schema
        run: python3 scripts/check_protocol_schema.py

      - name: Build release binaries
        run: cargo build --release --workspace

      - name: Build release package
        shell: bash
        run: |
          set -euo pipefail
          package_json="$(python3 packaging/build_release.py --force)"
          package="$(printf '%s' "$package_json" |
            python3 -c 'import json,sys; print(json.load(sys.stdin)["package"])')"
          archive="$(printf '%s' "$package_json" |
            python3 -c 'import json,sys; print(json.load(sys.stdin)["archive"])')"
          python3 tests/fixtures/release_acceptance_probe.py \
            --package "$package" \
            --archive "$archive"
          archive_dir="$(dirname "$archive")"
          archive_name="$(basename "$archive")"
          (cd "$archive_dir" && sha256sum "$archive_name") > "$archive.sha256"
          printf 'package=%s\narchive=%s\n' "$package" "$archive" >> "$GITHUB_ENV"

      - name: Upload release-gate evidence
        uses: actions/upload-artifact@v7
        with:
          name: qwe-linux-x86_64-package-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ env.archive }}
            ${{ env.archive }}.sha256

      - name: Publish GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 |
            python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          tag="${GITHUB_REF_NAME}"
          test "$tag" = "v${version}"
          notes="docs/releases/${tag}.md"
          test -f "$archive"
          test -f "${archive}.sha256"
          test -f "$notes"
          python3 scripts/publish_github_release.py \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$tag" \
            --archive "$archive" \
            --checksum "${archive}.sha256" \
            --notes "$notes"

