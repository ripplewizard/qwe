[workspace]
resolver = "2"
exclude = ["poc/rust"]
members = [
    "apps/qwe",
    "apps/qwe-worker",
    "apps/qwed",
    "crates/qwe-core",
    "crates/qwe-protocol",
    "crates/qwe-runtime",
    "crates/qwe-storage",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
getrandom = "0.3"
libc = "0.2"
portable-pty = "0.9"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v7"] }
vt100 = "0.18"
zeroize = "1"
